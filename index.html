<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tijdwerk — timer</title>
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;700&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- START SCHERM -->
  <section class="screen" id="screen-start" data-active="true">
    <div class="eyebrow">tijdwerk</div>
    <h1 class="title big">Zet een timer</h1>
    <p class="hint">Kies zelf hoe hij eruitziet — vertrekbord, terminal, golf of ruimte.</p>
    <button class="btn btn-primary" id="btn-new-timer">Timer instellen</button>
  </section>

  <!-- INSTEL SCHERM -->
  <section class="screen" id="screen-setup" data-active="false">
    <div class="eyebrow">instellen</div>
    <h1 class="title">Kies een stijl</h1>

    <div class="style-grid" id="style-grid">
      <button class="style-card" data-style="orbit" data-active="true">
        <span class="style-swatch swatch-orbit"></span>
        <span class="style-name">Orbit</span>
      </button>
      <button class="style-card" data-style="board">
        <span class="style-swatch swatch-board"></span>
        <span class="style-name">Vertrekbord</span>
      </button>
      <button class="style-card" data-style="terminal">
        <span class="style-swatch swatch-terminal"></span>
        <span class="style-name">Terminal</span>
      </button>
      <button class="style-card" data-style="wave">
        <span class="style-swatch swatch-wave"></span>
        <span class="style-name">Golf</span>
      </button>
    </div>

    <h2 class="subtitle">Hoe lang?</h2>
    <div class="picker-row">
      <div class="picker">
        <label for="input-hours">uren</label>
        <input type="number" id="input-hours" min="0" max="23" value="0" inputmode="numeric">
      </div>
      <div class="picker-sep">:</div>
      <div class="picker">
        <label for="input-minutes">minuten</label>
        <input type="number" id="input-minutes" min="0" max="59" value="25" inputmode="numeric">
      </div>
    </div>

    <div class="presets">
      <button class="chip" data-min="5">5m</button>
      <button class="chip" data-min="15">15m</button>
      <button class="chip" data-min="25">25m</button>
      <button class="chip" data-min="45">45m</button>
      <button class="chip" data-min="60">60m</button>
    </div>

    <div class="setup-actions">
      <button class="btn btn-ghost" id="btn-back-start">Terug</button>
      <button class="btn btn-primary" id="btn-start-timer">Start timer</button>
    </div>
  </section>

  <!-- RUNNING SCHERM -->
  <section class="screen" id="screen-running" data-active="false">
    <div class="run-top">
      <span class="run-style-label" id="run-style-label"></span>
    </div>

    <!-- ORBIT -->
    <div class="visual visual-orbit" data-style-visual="orbit">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 300 300">
          <circle class="ring-track" cx="150" cy="150" r="130"></circle>
          <circle class="ring-progress" id="orbit-progress" cx="150" cy="150" r="130"></circle>
        </svg>
        <div class="orbit-dot" id="orbit-dot"></div>
        <div class="ring-center">
          <span class="digits" id="orbit-digits">00:00:00</span>
        </div>
      </div>
    </div>

    <!-- VERTREKBORD -->
    <div class="visual visual-board" data-style-visual="board">
      <div class="board-row" id="board-row"></div>
      <div class="board-status" id="board-status"></div>
    </div>

    <!-- TERMINAL -->
    <div class="visual visual-terminal" data-style-visual="terminal">
      <div class="term-window">
        <div class="term-header">
          <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
          <span class="term-title">timer.sh</span>
        </div>
        <div class="term-body">
          <div class="term-line">$ ./aftellen --start</div>
          <div class="term-line">resterende tijd: <span class="term-digits" id="term-digits">00:00:00</span><span class="term-cursor">▌</span></div>
          <div class="term-line term-bar" id="term-bar"></div>
        </div>
      </div>
    </div>

    <!-- GOLF -->
    <div class="visual visual-wave" data-style-visual="wave">
      <div class="wave-wrap">
        <div class="wave-fluid" id="wave-fluid">
          <div class="wave-layer wave-back"></div>
          <div class="wave-layer wave-front"></div>
        </div>
        <div class="wave-digits" id="wave-digits">00:00:00</div>
      </div>
    </div>

    <div class="run-actions">
      <button class="btn btn-ghost" id="btn-reset">Reset</button>
      <button class="btn btn-primary" id="btn-pause">Pauzeer</button>
      <button class="btn btn-pip" id="btn-pip" title="Blijf in beeld als zwevend venster">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <rect x="12" y="10.5" width="7" height="5" rx="1" fill="currentColor"/>
        </svg>
        Zwevend venster
      </button>
    </div>
  </section>

  <!-- KLAAR SCHERM -->
  <section class="screen" id="screen-done" data-active="false">
    <div class="eyebrow">klaar</div>
    <div class="done-glow">✓</div>
    <h1 class="title">Tijd om!</h1>
    <div class="setup-actions">
      <button class="btn btn-ghost" id="btn-done-start">Terug naar start</button>
      <button class="btn btn-primary" id="btn-done-again">Zelfde timer opnieuw</button>
    </div>
  </section>

</main>

<audio id="chime" preload="auto">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script src="script.js"></script>
</body>
</html>
